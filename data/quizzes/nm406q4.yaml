title: "Quiz 4 – Sustainable Finance NM406"
subtitle: "Dr. Reiner Martin · THM Gießen · Wintersemester 2026/27"

questions:


  - text: "Welche der folgenden sind laut Vorlesung anerkannte nachhaltige Anlagestrategien?"
    multi: true
    options:
      - text: "Ausschlusskriterien"
        correct: true
      - text: "ESG-Integration"
        correct: true
      - text: "Impact Investment"
        correct: true
      - text: "Momentum-Investing"
        correct: false

  - text: "Welche Anlagestrategien beinhalten ein Screening-Verfahren?"
    multi: true
    options:
      - text: "Ausschlusskriterien"
        correct: true
      - text: "Normbasiertes Screening"
        correct: true
      - text: "Best-of-Class"
        correct: true
      - text: "Engagement"
        correct: false

  - text: "Welche der folgenden Normen werden typischerweise beim normbasierten Screening verwendet?"
    multi: true
    options:
      - text: "UN Global Compact"
        correct: true
      - text: "OECD-Leitsätze für multinationale Unternehmen"
        correct: true
      - text: "ILO-Kernarbeitsnormen"
        correct: true
      - text: "ISO 14001 Umweltmanagement"
        correct: false

  - text: "Welche Aussagen zum wertbasierten Screening sind korrekt?"
    multi: true
    options:
      - text: "Es schaut auf die Erfüllung nicht-standardisierter Kriterien"
        correct: true
      - text: "Investoren können sich an religiösen Werten orientieren"
        correct: true
      - text: "Die Kriterien können unabhängig von normierten Kenngrößen sein"
        correct: true
      - text: "Es ist identisch mit normbasiertem Screening"
        correct: false

  - text: "Welche dieser nachhaltigen Anlagestrategien hatte 2023 den höchsten Anteil bei deutschen Fonds?"
    multi: false
    options:
      - text: "Ausschlüsse"
        correct: true
      - text: "Nachhaltige Themenfonds"
        correct: false
      - text: "Best-In Class"
        correct: false
      - text: "Impact Investment"
        correct: false

  - text: "Welche Aussagen zum negativen Screening (Ausschlusskriterien) sind korrekt?"
    multi: true
    options:
      - text: "Bestimmte Investments werden systematisch vom Investmentuniversum ausgeschlossen"
        correct: true
      - text: "Der Ausschluss erfolgt bei Verstoß gegen spezifische Kriterien"
        correct: true
      - text: "Ausgeschlossen werden können Unternehmen, Branchen oder Länder"
        correct: true
      - text: "Es werden nur die besten Unternehmen innerhalb einer Branche ausgewählt"
        correct: false

  - text: "Welche der folgenden gehören zu den Top-10 unternehmensbezogenen Ausschlusskriterien in Deutschland 2023?"
    multi: true
    options:
      - text: "ABC-Waffen"
        correct: true
      - text: "Fossile Energieträger/Kohle"
        correct: true
      - text: "Tabak"
        correct: true
      - text: "Alkohol"
        correct: false

  - text: "Welche Eigenschaften charakterisieren laut MSCI ESG eine kontroverse Waffe?"
    multi: true
    options:
      - text: "Wahllose und nicht steuerbare Wirkungsweise"
        correct: true
      - text: "Klassifikation als Massenvernichtungswaffe"
        correct: true
      - text: "Übermäßig großer Schaden und erhebliche Schmerzen"
        correct: true
      - text: "Weitreichende langanhaltende Folgen für betroffene Bevölkerungsgruppen"
        correct: true

