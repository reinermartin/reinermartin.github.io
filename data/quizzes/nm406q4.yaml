  - text: "Welche Praktiken fallen laut ESRS-Definition unter Korruption?"
    multi: true
    options:
      - text: "Bestechungsgelder"
        correct: true
      - text: "Betrug und Erpressung"
        correct: true
      - text: "Geheime Absprachen"
        correct: true
      - text: "Geldwäsche"
        correct: true

  - text: "Welche Formen von Leistungen können laut ESRS-Definition Korruption darstellen?"
    multi: true
    options:
      - text: "Geldleistungen"
        correct: true
      - text: "Sachleistungen wie unentgeltliche Waren und Geschenke"
        correct: true
      - text: "Besondere persönliche Dienstleistungen"
        correct: true
      - text: "Reguläre Gehaltszahlungen gemäß Arbeitsvertrag"
        correct: false

  - text: "Welche Faktoren tragen laut WEF-Studie zur Marginalisierung von Korruptionsrisiken in ESG-Ratings bei?"
    multi: true
    options:
      - text: "Inkonsistente Terminologie"
        correct: true
      - text: "Inkonsistente Formulierung"
        correct: true
      - text: "Inkonsistentes Reporting"
        correct: true
      - text: "Starke Ökologisierung von ESG"
        correct: true

  - text: "Welche der folgenden deutschen Unternehmen waren in bekannte Korruptionsfälle verwickelt?"
    multi: true
    options:
      - text: "BASF"
        correct: false
      - text: "Siemens"
        correct: true
      - text: "Wirecard"
        correct: true
      - text: "Volkswagen"
        correct: true

  - text: "Was ist das Kernproblem beim Wirecard-Skandal (Insolvenz Juni 2020)?"
    multi: false
    options:
      - text: "Verbotene Abschalteinrichtungen in Produkten"
        correct: false
      - text: "Schwächen in der Geldwäscheprävention"
        correct: false
      - text: "Knapp 2 Mrd. € der Bilanz waren nicht aufzufinden"
        correct: true
      - text: "Bestechung ausländischer Regierungsbeamter"
        correct: false

  - text: "Welche Aussagen zur ESG-Integration sind korrekt?"
    multi: true
    options:
      - text: "ESG-Kriterien und -Risiken werden explizit in die Wertpapieranalyse einbezogen"
        correct: true
      - text: "Die Auswahl berücksichtigt sowohl quantitative als auch qualitative ESG-Kriterien"
        correct: true
      - text: "ESG-Integration kann auf Equities und Fixed Income angewendet werden"
        correct: true
      - text: "ESG-Integration schließt immer alle kontroversen Branchen aus"
        correct: false

  - text: "Welche Aussagen zum Best-in-Class-Ansatz sind korrekt?"
    multi: true
    options:
      - text: "Es werden die nachhaltigsten Investitionsmöglichkeiten innerhalb eines Bereichs ausgewählt"
        correct: true
      - text: "Nachhaltige Aktivitäten von Unternehmen werden gegenüber weniger nachhaltigen der gleichen Branche bevorteilt"
        correct: true
      - text: "Eine sehr große Streuung des Anlageportfolios ist ausgeschlossen"
        correct: false
      - text: "Keine Branche wird per se ausgeschlossen"
        correct: true

  - text: "Welche Schritte kennzeichnen den Best-of-Class-Ansatz?"
    multi: true
    options:
      - text: "Zunächst werden Ausschlusskriterien auf das Anlageuniversum angewendet"
        correct: true
      - text: "Kontroverse Anlagemöglichkeiten wie fossile Energiebereitstellung werden ausgeschlossen"
        correct: true
      - text: "Anschließend erfolgt eine Selektion anhand von Positivkriterien"
        correct: true
      - text: "Er ist eine Mischform aus positivem und negativem Screening"
        correct: true

  - text: "Welche Aussagen zum Best-in-Progress-Ansatz sind korrekt?"
    multi: true
    options:
      - text: "Er ist eine Weiterentwicklung des Best-in-Class-Ansatzes"
        correct: true
      - text: "Auch Unternehmen mit bisher schlechter Performance können ausgewählt werden, wenn sie gute Fortschritte zeigen"
        correct: true
      - text: "Er erkennt an, dass nachhaltige Entwicklung ein kontinuierlicher Prozess ist"
        correct: true
      - text: "Er schließt immer die gesamte fossile Energiebranche aus"
        correct: false

  - text: "Welche Aussagen zu Engagement als nachhaltiger Anlagestrategie sind korrekt?"
    multi: true
    options:
      - text: "Der Anteilseigner sucht aktiven und langfristigen Austausch mit dem Unternehmen"
        correct: true
      - text: "Ziel ist die Sensibilisierung der Unternehmensführung für ESG-Kriterien"
        correct: true
      - text: "Engagement kann Stimmrechtsausübungen auf Hauptversammlungen beinhalten"
        correct: true
      - text: "Engagement ist eine aufwendige und langwierige Umsetzungsstrategie"
        correct: true

  - text: "Welche Wirkungen kann Engagement laut Vorlesung entfalten?"
    multi: true
    options:
      - text: "Direkter Einfluss auf die Unternehmensführung (voice)"
        correct: true
      - text: "Stimmrechtsausübungen auf Hauptversammlungen (vote)"
        correct: true
      - text: "Gesteigerte Aufmerksamkeit der Öffentlichkeit und anderer Stakeholder"
        correct: true
      - text: "Sofortiger Ausschluss des Unternehmens aus allen ESG-Indizes"
        correct: false

  - text: "Welche Aussagen zum UN Global Compact sind korrekt?"
    multi: true
    options:
      - text: "Er ist ein weltweiter Pakt zwischen Unternehmen und der UN"
        correct: true
      - text: "Er zielt darauf ab, die Globalisierung sozialer und ökologischer zu gestalten"
        correct: true
      - text: "Weltweit haben sich über 20.000 Teilnehmer zu zehn Prinzipien verpflichtet"
        correct: true
      - text: "Er ist rechtlich verbindlich für alle Unterzeichner"
        correct: false

  - text: "Womit beschäftigen sich die ILO-Kernarbeitsnormen?"
    multi: true
    options:
      - text: "Vereinigungsfreiheit"
        correct: true
      - text: "Diskriminierungsverbot in Beschäftigung und Beruf"
        correct: true
      - text: "Abschaffung von Kinderarbeit"
        correct: true
      - text: Mindestlohnregelungen für alle Branchen weltweit
        correct: false

  - text: "Welche Waffengattungen fallen unter die Cluster Munitions Convention oder den Mine Ban Treaty?"
    multi: true
    options:
      - text: "Streubomben (Cluster Munitions Convention)"
        correct: true
      - text: "Landminen (Mine Ban Treaty)"
        correct: true
      - text: "Blendende Laserwaffen"
        correct: false
      - text: "Uranangereicherte Waffen"
        correct: false

  - text: "Welche Aussagen zu den OECD-Leitsätzen für multinationale Unternehmen sind korrekt?"
    multi: true
    options:
      - text: "Sie sind ein Verhaltenskodex für weltweit verantwortungsvolles Handeln"
        correct: true
      - text: "Sie enthalten Empfehlungen von Regierungen an die Wirtschaft"
        correct: true
      - text: "Sie können beim normbasierten Screening verwendet werden"
        correct: true
      - text: "Sie sind identisch mit dem UN Global Compact"
        correct: false

  - text: "Welche Aussagen über den Corruption Perceptions Index (CPI) 2023 lassen sich aus dem Vorlesungsmaterial ableiten?"
    multi: true
    options:
      - text: "Er wird von Transparency International herausgegeben"
        correct: true
      - text: "Er misst die wahrgenommenen Korruptionsniveaus im öffentlichen Sektor"
        correct: true
      - text: "Er erfasst 180 Länder und Territorien"
        correct: true
      - text: "Dänemark erreichte 2023 den höchsten Score (90)"
        correct: true

  - text: "Welche Anlagestrategien können als aktionärsorientierte Einflussnahmestrategien bezeichnet werden?"
    multi: true
    options:
      - text: "Engagement (voice)"
        correct: true
      - text: "Stimmrechtsausübung (vote)"
        correct: true
      - text: "Aktionärsanträge zu Nachhaltigkeitsaspekten"
        correct: true
      - text: "Ausschlusskriterien (negatives Screening)"
        correct: false

