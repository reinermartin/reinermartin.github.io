    multi: false
    options:
      - text: "Die Finanzkrise 2008, bei der viele Privatanleger hohe Verluste mit Wertpapieren erlitten, deren Funktion sie nicht immer verstanden hatten."
        correct: true
      - text: "Der Brexit und damit verbundene Regulierungslücken."
        correct: false
      - text: "Die Einführung des Euro und die damit verbundene Harmonisierung."
        correct: false
      - text: "Die Digitalisierung der Finanzmärkte."
        correct: false

  - text: "Welche Ziele verfolgt MiFID II?"
