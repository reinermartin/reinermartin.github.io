title: "Quiz 3 – Sustainable Finance NM406"
subtitle: "Dr. Reiner Martin · THM Gießen · Wintersemester 2026/27"

questions:
  - text: "Wofür steht die Abkürzung SFDR?"
    multi: false
    options:
      - text: "Sustainable Finance Disclosure Regulation"
        correct: true
      - text: "Social Finance and Development Regulation"
        correct: false
      - text: "Sustainable Fund Diversity Requirement"
        correct: false
      - text: "Standard Finance Data Reporting"
        correct: false

  - text: "Wen betrifft die SFDR primär?"
    multi: true
    options:
      - text: "Finanzinstitute"
        correct: true
      - text: "Vermögensverwalter"
        correct: true
      - text: "Investmentfonds"
        correct: true
      - text: "Alle Unternehmen mit mehr als 250 Mitarbeitenden"
        correct: false
      - text: "Nur börsennotierte Unternehmen im DAX"
        correct: false

  - text: "Welche Ziele verfolgt die SFDR?"
    multi: true
    options:
      - text: "Vergleichbarkeit nachhaltiger Anlagestrategien für Anleger erleichtern."
        correct: true
      - text: "Mehr Transparenz darüber schaffen, inwieweit Finanzprodukte ökologische und/oder soziale Kriterien berücksichtigen."
        correct: true
      - text: "Präsentation in standardisiertem Format."
        correct: true
      - text: "Einheitliche CO₂-Bepreisung für Finanzprodukte einführen."
        correct: false
      - text: "Die Abschaffung konventioneller Anlageprodukte."
        correct: false

  - text: "Was verlangt die SFDR von Vermögensverwaltern und Anlageberatern auf Unternehmensebene?"
    multi: true
    options:
      - text: "Offenlegung zu Nachhaltigkeitsrisiken."
        correct: true
      - text: "Offenlegung zu wesentlichen nachteiligen Auswirkungen (PAI)."
        correct: true
      - text: "Transparenz darüber, inwieweit die Vergütungspolitik mit der Berücksichtigung von Nachhaltigkeitsrisiken im Einklang steht."
        correct: true
      - text: "Mindestens 30 % des Portfolios in grüne Anleihen zu investieren."
        correct: false
      - text: "Jährliche CO₂-Kompensationszahlungen zu leisten."
        correct: false

  - text: "Wofür steht PAI in der SFDR?"
    multi: false
    options:
      - text: "Paris Alignment Index"
        correct: false
      - text: "Principal Adverse Impact"
        correct: true
      - text: "Portfolio Allocation Instrument"
        correct: false
      - text: "Proxy Advisory Indicator"
        correct: false

  - text: "Wie viele verpflichtende PAI-Indikatoren gibt es insgesamt, und wie verteilen sie sich?"
    multi: true
    options:
      - text: "14 Indikatoren für Emittenten auf Unternehmensebene."
        correct: true
      - text: "2 Indikatoren speziell für staatliche und supranationale Emittenten."
        correct: true
      - text: "2 Indikatoren für Emittenten aus dem Immobiliensektor."
        correct: true
      - text: "10 Indikatoren ausschließlich für Hedgefonds."
        correct: false

  - text: "Welche Klima-/Umwelt-Indikatoren gehören zu den verpflichtenden PAI-Elementen für Investitionen in Unternehmen?"
    multi: true
    options:
      - text: "Treibhausgasemissionen (THG)"
        correct: true
      - text: "Wasseremissionen"
        correct: true
      - text: "Negative Auswirkungen auf biodiversitätssensible Gebiete"
        correct: true
      - text: "Gefährliche Abfälle"
        correct: true
      - text: "Gesamtumsatz des Unternehmens"
        correct: false
      - text: "Dividendenrendite"
        correct: false

  - text: "Welcher SFDR-Artikel beschreibt sogenannte 'braune Fonds'?"
    multi: false
    options:
      - text: "Artikel 6"
        correct: true
      - text: "Artikel 7"
        correct: false
      - text: "Artikel 8"
        correct: false
      - text: "Artikel 9"
        correct: false

  - text: "Was kennzeichnet einen SFDR-Artikel-8-Fonds?"
    multi: false
    options:
      - text: "Er hat kein nachhaltiges Anlageziel und bewertet nur Umweltrisiken."
        correct: false
      - text: "Er hat ein konkretes nachhaltiges Anlageziel, das über wirtschaftliche Gewinne hinausgeht."
        correct: false
      - text: "Er ist verpflichtet, eine Nachhaltigkeitsstrategie zu veröffentlichen und zu berücksichtigen (hellgrüner Fonds / ESG-Fonds)."
        correct: true
      - text: "Er investiert ausschließlich in Staatsanleihen."
        correct: false

  - text: "Wie werden die drei SFDR-Produktkategorien informell bezeichnet?"
    multi: true
    options:
      - text: "Artikel 6 – braune Fonds"
        correct: true
      - text: "Artikel 8 – hellgrüne Fonds / ESG-Fonds"
        correct: true
      - text: "Artikel 9 – dunkelgrüne Fonds / Impact-Fonds"
        correct: true
      - text: "Artikel 7 – gelbe Fonds"
        correct: false
      - text: "Artikel 10 – blaue Fonds"
        correct: false

  - text: "Welche Rolle spielt die Taxonomie im Verhältnis zu CSRD und SFDR?"
    multi: false
    options:
      - text: "Sie ersetzt CSRD und SFDR vollständig."
        correct: false
      - text: "Sie bietet die grundlegenden Kriterien zur Identifizierung nachhaltiger Aktivitäten, die für die Berichterstattung gemäß CSRD und SFDR erforderlich sind."
        correct: true
      - text: "Sie reguliert ausschließlich Investmentfonds."
        correct: false
      - text: "Sie ist nur für staatliche Unternehmen relevant."
        correct: false

  - text: "Welche Aussage beschreibt den Zweck der EU-Taxonomie am besten?"
    multi: false
    options:
      - text: "Klassifizierungssystem für nachhaltige Wirtschaftsaktivitäten"
        correct: true
      - text: "Standard für die unternehmerische Nachhaltigkeitsberichterstattung"
        correct: false
      - text: "Offenlegungsregime für Finanzmarktteilnehmer und ihre Produkte"
        correct: false
      - text: "Gütesiegel für nachhaltige Fonds im Retail-Vertrieb"
        correct: false

  - text: "Wie hängen CSRD und SFDR zusammen?"
    multi: false
    options:
      - text: "Die SFDR liefert Daten, die Unternehmen in CSRD-Berichte übernehmen"
        correct: false
      - text: "Die CSRD liefert Unternehmensdaten, auf denen die SFDR aufbaut"
        correct: true
      - text: "Beide ersetzen sich gegenseitig je nach Unternehmensgröße"
        correct: false
      - text: "Die CSRD gilt nur für Fonds, die SFDR nur für die Realwirtschaft"
        correct: false

  - text: "Welche Aussagen zur Rolle der EU-Taxonomie treffen zu?"
    multi: true
    options:
      - text: "Sie wird im Rahmen von CSRD und SFDR angewendet"
        correct: true
      - text: "Sie schreibt allen Fonds eine Mindestquote von 70 % vor"
        correct: false
      - text: "Sie erleichtert taxonomiekonforme Investitionsentscheidungen"
        correct: true
      - text: "Sie ersetzt die ESG-Kennzahlen der CSRD-Nachhaltigkeitsberichte"
        correct: false

  - text: "Wann legte die Europäische Kommission ihren Vorschlag zur Reform der SFDR („SFDR 2.0“) vor?"
    multi: false
    options:
      - text: "Im März 2021 mit dem Geltungsbeginn der SFDR"
        correct: false
      - text: "Im Juni 2023 im Zuge der CSRD-Umsetzung"
        correct: false
      - text: "Im November 2025"
        correct: true
      - text: "Im Januar 2027 nach einer ESMA-Konsultation"
        correct: false

  - text: "Welche Gründe werden für die Reform der SFDR angeführt?"
    multi: true
    options:
      - text: "Art. 8/9 werden faktisch als ESG-Labels interpretiert"
        correct: true
      - text: "Hohe Komplexität und geringe Vergleichbarkeit"
        correct: true
      - text: "Fehlende Anwendung der Taxonomie in der CSRD-Berichterstattung"
        correct: false
      - text: "Probleme bei der Datenqualität der PAI-Indikatoren"
        correct: true

  - text: "Als was waren Art. 8 und Art. 9 der SFDR ursprünglich konzipiert?"
    multi: false
    options:
      - text: "Als Gütesiegel für nachhaltige Fonds"
        correct: false
      - text: "Als Mindeststandards für ESG-Ratings"
        correct: false
      - text: "Als Ausschlusslisten für fossile Sektoren"
        correct: false
      - text: "Als reines Transparenzregime"
        correct: true

  - text: "Welche der folgenden Punkte gehören zu den geplanten Änderungen unter SFDR 2.0?"
    multi: true
    options:
      - text: "Mehr PAI-Berichtspflichten auf Unternehmensebene"
        correct: false
      - text: "Kürzere Templates von maximal ca. zwei Seiten"
        correct: true
      - text: "Strengere Regeln für Produktklassifizierung und Marketing"
        correct: true
      - text: "Abschaffung jeglicher Produktkategorien zugunsten von Einzelangaben"
        correct: false

  - text: "Welche Kernanforderung gilt für die Übergangskategorie (Art. 7 neu)?"
    multi: false
    options:
      - text: "70 % in Unternehmen mit glaubwürdigem Transformationspfad"
        correct: true
      - text: "70 % mit systematischer ESG-Integration aller Anlageentscheidungen"
        correct: false
      - text: "70 % mit messbarem Nachhaltigkeitsziel"
        correct: false
      - text: "100 % in taxonomiekonforme Wirtschaftsaktivitäten"
        correct: false

  - text: "Für welche neue Produktkategorie ist die Berücksichtigung von PAI nicht verpflichtend?"
    multi: false
    options:
      - text: "Übergangskategorie (Art. 7 neu)"
        correct: false
      - text: "ESG-Basis (Art. 8 neu)"
        correct: true
      - text: "Nachhaltigkeitskategorie (Art. 9 neu)"
        correct: false
      - text: "Für keine der neuen Kategorien"
        correct: false

  - text: "Für welche Produkte ist die gemischte Kategorie (Art. 9a neu) insbesondere relevant?"
    multi: false
    options:
      - text: "Für Einzeltitelfonds mit Ausschlussstrategie"
        correct: false
      - text: "Für Staatsanleihefonds der Eurozone"
        correct: false
      - text: "Für Dachfonds"
        correct: true
      - text: "Für geschlossene Immobilienfonds"
        correct: false

  - text: "Welche Aussagen zu den neuen Produktkategorien unter SFDR 2.0 treffen zu?"
    multi: true
    options:
      - text: "Drei Kategorien setzen eine 70-%-Quote voraus"
        correct: true
      - text: "Bei Art. 9a neu hängt die PAI-Pflicht von der Unterkategorie ab"
        correct: true
      - text: "Art. 8 neu verlangt zusätzlich ein messbares Nachhaltigkeitsziel"
        correct: false
      - text: "Für Art. 7 neu und Art. 9 neu sind PAI verpflichtend"
        correct: true

  - text: "Worauf liegt der Schwerpunkt der SFDR?"
    multi: false
    options:
      - text: "Klassifizierung nachhaltiger Wirtschaftsaktivitäten"
        correct: false
      - text: "Qualität der unternehmerischen Nachhaltigkeitsberichte"
        correct: false
      - text: "Festlegung verbindlicher CO₂-Preise für Finanzprodukte"
        correct: false
      - text: "Transparenz bei ESG-Offenlegungen und Anlagepraktiken"
        correct: true


















  - text: "Wann wurde MiFID I erlassen und wann in deutsches Recht umgesetzt?"
