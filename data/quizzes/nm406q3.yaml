      - text: "Verbesserung des Verbraucherschutzes."
        correct: true
      - text: "Harmonisierung der Regulierung von Finanzinstrumenten auf dem europäischen Binnenmarkt."
        correct: true
      - text: "Einführung einer Finanztransaktionssteuer."
        correct: false
      - text: "Abschaffung des Eigenhandels von Banken."
        correct: false

