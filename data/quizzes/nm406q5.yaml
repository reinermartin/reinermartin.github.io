title: "Quiz 5 – Sustainable Finance NM406"
subtitle: "Dr. Reiner Martin · THM Gießen · Wintersemester 2026/27"

questions:
  - text: "Was sind Impact Investments?"
    multi: true
    options:
      - text: "Investitionen, die neben monetären Erträgen eine messbare ökologische und/oder soziale Wirkung anstreben"
        correct: true
      - text: "Die Messbarkeit der erzielten Wirkung ist ein kennzeichnendes Merkmal"
        correct: true
      - text: "Sie können sowohl Unternehmens-Impact als auch Investor-Impact umfassen"
        correct: true
      - text: "Sie schließen immer eine Rendite unter Marktrendite ein"
        correct: false

  - text: "Welche der folgenden Merkmale nennt das GIIN als Kernmerkmale von Impact Investing?"
    multi: true
    options:
      - text: "Intentionally Contribute to Positive Social and Environmental Impact"
        correct: true
      - text: "Use Evidence and Impact Data in Investment Design"
        correct: true
      - text: "Manage Impact Performance"
        correct: true
      - text: "Contribute to the Growth of Impact Investing"
        correct: true

  - text: "Welche Aussagen zu wirkungskompatiblen (impact-aligned) Investitionen sind korrekt?"
    multi: true
    options:
      - text: "Es kann nachgewiesen werden, dass die zugrundeliegenden Unternehmen eine Wirkung erzielen"
        correct: true
      - text: "Der Unternehmens-Impact wird belegt"
        correct: true
      - text: "Der Investor-Impact wird nicht belegt"
        correct: true
      - text: "Ein Beispiel ist ein Fonds, dessen THG-Emissionen 50 % unter einem Vergleichsportfolio liegen"
        correct: true

  - text: "Welche Aussagen zu wirkungseffektiven (impact-generating) Investitionen sind korrekt?"
    multi: true
    options:
      - text: "Sowohl Unternehmens-Impact als auch Investor-Impact werden nachgewiesen"
        correct: true
      - text: "Der Investor kann belegen, dass seine Aktivitäten die positiven Beiträge mitverursacht haben"
        correct: true
      - text: "Ein Beispiel ist ein Fonds, der durch Mikrofinanzinvestitionen in Indien nachweislich 1000 t THGe reduziert"
        correct: true
      - text: "Es reicht aus, dass das Portfolio weniger THG-Emissionen als ein Vergleichsportfolio aufweist"
        correct: false


  - text: "Wo findet man die wichtigsten Informationen über einen Investmentfonds?"
    multi: false
    options:
      - text: "Im Jahresabschluss des Fondsmanagers"
        correct: false
      - text: "Im Fondsfaktenblatt (Fact Sheet)"
        correct: true
      - text: "Im Handelsregister"
        correct: false
      - text: "In der Satzung der Fondsgesellschaft"
        correct: false

  - text: "Welche der folgenden Informationen findet man typischerweise im Fondsfaktenblatt?"
    multi: true
    options:
      - text: "Ziel und Strategie des Fonds"
        correct: true
      - text: "Gebühren (Verwaltung, Erfolg, Zeichnung und Rücknahme)"
        correct: true
      - text: "Steuernummer des Fondsmanagers"
        correct: false
      - text: "Historische Renditen über verschiedene Zeiträume"
        correct: true

  - text: "Was misst das Alpha eines Fonds?"
    multi: false
    options:
      - text: "Die Volatilität des Fonds im Vergleich zum Geldmarkt"
        correct: false
      - text: "Die Wertentwicklung eines Fonds im Vergleich zu seiner Benchmark"
        correct: true
      - text: "Den maximalen Verlust innerhalb einer Periode"
        correct: false
      - text: "Die Abweichung der Rendite vom Vergleichsindex"
        correct: false

  - text: "Was bedeutet ein Beta von 1 bei einem Fonds?"
    multi: false
    options:
      - text: "Der Fonds erzielt eine Überrendite gegenüber dem Markt"
        correct: false
      - text: "Der Fonds schwankt ähnlich wie der Markt"
        correct: true
      - text: "Der Fonds ist risikolos"
        correct: false
      - text: "Der Fonds bildet den Index exakt nach"
        correct: false

  - text: "Was setzt die Sharpe-Ratio ins Verhältnis?"
    multi: false
    options:
      - text: "Überrendite zum Tracking Error"
        correct: false
      - text: "Alpha zum Beta"
        correct: false
      - text: "Überrendite zum eingegangenen Risiko (Standardabweichung)"
        correct: true
      - text: "Maximum Drawdown zur durchschnittlichen Rendite"
        correct: false

  - text: "Was misst der Tracking Error?"
    multi: false
    options:
      - text: "Den maximalen Verlust eines Fonds"
        correct: false
      - text: "Wie stark die Renditen eines Fonds von der Rendite des Vergleichsindex abweichen"
        correct: true
      - text: "Die Überrendite gegenüber dem risikofreien Zinssatz"
        correct: false
      - text: "Die Sensitivität gegenüber Marktschwankungen"
        correct: false

  - text: "Ein niedriger Tracking Error bedeutet..."
    multi: false
    options:
      - text: "...dass der Fonds eine hohe Überrendite erzielt"
        correct: false
      - text: "...dass der Fonds den Index exakter nachbildet"
        correct: true
      - text: "...dass das Fondsrisiko besonders hoch ist"
        correct: false
      - text: "...dass der Fonds aktiv gemanagt wird"
        correct: false

  - text: "Was setzt die Information Ratio ins Verhältnis?"
    multi: false
    options:
      - text: "Alpha zu Beta"
        correct: false
      - text: "Überrendite zum Tracking Error"
        correct: true
      - text: "Rendite zur Standardabweichung"
        correct: false
      - text: "Fondsvolumen zur Benchmark-Rendite"
        correct: false

  - text: "Was zeigt der Maximum Drawdown?"
    multi: false
    options:
      - text: "Den aktuellen Verlust seit dem letzten Hoch"
        correct: false
      - text: "Wie stark der Wert eines Fonds innerhalb eines Zeitraums gefallen ist – vom höchsten bis zum tiefsten Punkt"
        correct: true
      - text: "Die durchschnittliche jährliche Rendite des Fonds"
        correct: false
      - text: "Den Vergleich mit dem Marktindex"
        correct: false

  - text: "Was ist der Unterschied zwischen Maximum Drawdown und Current Drawdown?"
    multi: false
    options:
      - text: "Es gibt keinen Unterschied, beide Begriffe sind synonym"
        correct: false
      - text: "Maximum Drawdown ist der maximale Verlust der Periode; Current Drawdown ist der aktuelle Verlust seit dem letzten Hoch"
        correct: true
      - text: "Current Drawdown bezieht sich immer auf das gesamte Jahr"
        correct: false
      - text: "Maximum Drawdown wird täglich, Current Drawdown monatlich berechnet"
        correct: false

  - text: "Zu welchem Themenbereich gehört der Investitionsschwerpunkt Entsalzung?"
    multi: false
    options:
      - { text: "Klimaschutz", correct: false }
      - { text: "Kreislaufwirtschaft", correct: false }
      - { text: "Erneuerbare Energien", correct: false }
      - { text: "Wasser", correct: true }

  - text: "Wie wird kultiviertes Fleisch hergestellt?"
    multi: false
    options:
      - { text: "Aus Erbsen-, Soja- oder Lupinenprotein", correct: false }
      - { text: "Durch Mikroorganismen per Fermentation", correct: false }
      - { text: "Aus tierischen Zellen in Bioreaktoren", correct: true }
      - { text: "Aus gemahlenen Grillen und Mehlwürmern", correct: false }

  - text: "Welcher Investitionsschwerpunkt gehört zur Kreislaufwirtschaft?"
    multi: false
    options:
      - { text: "Dekarbonisierung", correct: false }
      - { text: "Energieeffizienz", correct: false }
      - { text: "Elektromobilität", correct: false }
      - { text: "Abfallvermeidung", correct: true }

  - text: "Welcher Aspekt wird bei alternativen Proteinen als Vorbehalt genannt?"
    multi: false
    options:
      - { text: "Geringerer Flächenbedarf", correct: false }
      - { text: "Weniger Treibhausgasemissionen", correct: false }
      - { text: "Skalierbarkeit der Produktion", correct: true }
      - { text: "Bessere Ernährungssicherheit", correct: false }

  - text: "Warum gelten alternative Proteine als mögliches nachhaltiges Anlagethema?"
    multi: true
    options:
      - { text: "Sie können den Flächenbedarf reduzieren", correct: true }
      - { text: "Sie haben einen geringen Energiebedarf", correct: false }
      - { text: "Sie können den Wasserverbrauch senken", correct: true }
      - { text: "Sie können die Ernährungssicherheit verbessern", correct: true }

  - text: "Welche Aussagen zu Insektenproteinen treffen zu?"
    multi: true
    options:
      - { text: "Sie werden in Bioreaktoren aus Zellen gezüchtet", correct: false }
      - { text: "Sie stammen etwa aus Grillen oder Mehlwürmern", correct: true }
      - { text: "Sie entstehen durch Fermentation mit Mikroben", correct: false }
      - { text: "Sie können auch als Futtermittel dienen", correct: true }