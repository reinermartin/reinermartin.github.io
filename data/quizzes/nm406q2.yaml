  - text: "Das EU Emissions Trading System (EU ETS) wurde in folgendem Jahr ins Leben gerufen"
    multi: false
    options:
      - text: "2005"
        correct: true
      - text: "2000"
        correct: false
      - text: "2012"
        correct: false
      - text: "2019"
        correct: false

  - text: "Folgende Sektoren deckt das EU ETS ab"
    multi: true
    options:
      - text: "Strom- und Wärmeerzeugung"
        correct: true
      - text: "Industrielles verarbeitendes Gewerbe"
        correct: true
      - text: "Luftfahrt (innereuropäisch seit 2012)"
        correct: true
      - text: "Landwirtschaft"
        correct: false
      - text: "Privathaushalte"
        correct: false

  - text: "Das zentrale Startproblem des EU ETS bis ca. 2017 war folgendes"
    multi: false
    options:
      - text: "Wenig ambitionierte Caps und krisenbedingter Emissionsrückgang führten zu einem Zertifikatsüberschuss und Preisverfall unter 3 €, was die Wirksamkeit stark einschränkte."
        correct: true
      - text: "Der Preis für EUA-Zertifikate war zu hoch und belastete die Industrie übermäßig."
        correct: false
      - text: "Es gab zu wenige Marktteilnehmer, da nur Deutschland und Frankreich teilnahmen."
        correct: false
      - text: "Das System erfasste zu viele Sektoren und war administrativ nicht handhabbar."
        correct: false

  - text: "Die Marktstabilitätsreserve (MSR) verfolgt folgende Zwecke"
    multi: true
    options:
      - text: "Starke Preisschwankungen im EU ETS abzufedern"
        correct: true
      - text: "Den Überschuss an Zertifikaten im Umlauf zu reduzieren"
        correct: true
      - text: "Den CO₂-Preis auf einem festen Niveau zu halten"
        correct: false
      - text: "Neue Sektoren automatisch ins EU ETS einzubeziehen"
        correct: false

  - text: "Der Wasserbett-Effekt im Kontext des EU ETS bezeichnet folgendes"
    multi: false
    options:
      - text: "Wenn einzelne Länder zusätzliche Reduktionsanstrengungen unternehmen, werden dadurch nur Zertifikate für andere Teilnehmer günstiger, ohne die Gesamtemissionen zu senken."
        correct: true
      - text: "Wenn der EUA-Preis steigt, weichen Unternehmen auf günstigere ausländische Standorte aus."
        correct: false
      - text: "Wenn zu viele Zertifikate ausgegeben werden, sinkt der Preis unter die Produktionskosten."
        correct: false
      - text: "Wenn Emissionen in einem Sektor sinken, steigen sie in einem anderen proportional an."
        correct: false

  - text: "Carbon Leakage bezeichnet folgendes Phänomen"
    multi: false
    options:
      - text: "Die Verlagerung CO₂-intensiver Industrien in Länder ohne CO₂-Preise, um Kosten zu umgehen."
        correct: true
      - text: "Den natürlichen Austritt von CO₂ aus Böden und Ozeanen."
        correct: false
      - text: "Den Verlust von Emissionszertifikaten durch Betrug im Handelssystem."
        correct: false
      - text: "Die unbeabsichtigte Freisetzung von Treibhausgasen bei der Zertifikatsauktion."
        correct: false

  - text: "Der Carbon Border Adjustment Mechanism (CBAM) funktioniert folgendermaßen"
    multi: false
    options:
      - text: "Importeure müssen für Produkte aus Ländern ohne CO₂-Preise CBAM-Zertifikate kaufen, um den Preisunterschied zu ETS-Zertifikaten auszugleichen."
        correct: true
      - text: "Exportorientierte Unternehmen erhalten kostenlose Emissionszertifikate zugeteilt."
        correct: false
      - text: "Es handelt sich um einen internationalen Vertrag zur Harmonisierung von CO₂-Steuern weltweit."
        correct: false
      - text: "Es ist ein Fonds zur Finanzierung klimafreundlicher Importe aus Entwicklungsländern."
        correct: false

  - text: "Die Preisbildung bei EUA-Auktionen funktioniert folgendermaßen"
    multi: false
    options:
      - text: "Teilnehmer geben verdeckte Höchstgebote ab; der niedrigste Preis, zu dem alle angebotenen Zertifikate verkauft werden können, gilt als einheitlicher Auktionspreis für alle."
        correct: true
      - text: "Jeder Bieter zahlt seinen individuell gebotenen Preis."
        correct: false
      - text: "Der Preis wird vom Regulierer vorab festgelegt."
        correct: false
      - text: "Zertifikate werden zum Marktpreis des Vortages vergeben."
        correct: false

  - text: "Woraus speist sich der Klima- und Transformationsfonds (KTF) im Kern?"
    multi: false
    options:
      - text: "Aus Einnahmen der Kfz- und Energiesteuer"
        correct: false
      - text: "Aus Einnahmen des nationalen und EU-Emissionshandels"
        correct: true
      - text: "Aus Kreditaufnahmen im Rahmen der Schuldenbremse"
        correct: false
      - text: "Aus Gewinnausschüttungen der Deutschen Bundesbank"
        correct: false

  - text: "Welche Maßnahmen werden aus dem KTF finanziert? (Mehrere Antworten möglich)"
    multi: true
    options:
      - text: "Energetische Gebäudesanierung und neue Heizungssysteme"
        correct: true
      - text: "Direkte Kapitalbeteiligungen an Energieversorgern"
        correct: false
      - text: "Strompreiskompensation für energieintensive Branchen"
        correct: true
      - text: "Zuschüsse zur gesetzlichen Rentenversicherung"
        correct: false

  - text: "Welche Aussage zur Entstehung des KTF trifft zu?"
    multi: false
    options:
      - text: "2015 im Zuge des Pariser Klimaabkommens gegründet"
        correct: false
      - text: "2022 als Nachfolger des Kohleausstiegsfonds errichtet"
        correct: false
      - text: "2025 aus dem 500-Mrd.-Sondervermögen hervorgegangen"
        correct: false
      - text: "2011 als Energie- und Klimafonds (EKF) errichtet"
        correct: true

  - text: "Folgende Aussagen zum deutschen nationalen Emissionshandelssystem (nEHS) sind korrekt"
    multi: true
    options:
      - text: "Es trat 2021 auf Grundlage des Brennstoffemissionshandelsgesetzes (BEHG) in Kraft."
        correct: true
      - text: "Es bepreist CO₂-Emissionen in den Bereichen Wärme, Verkehr und Abfall."
        correct: true
      - text: "Seit 2026 beginnt die Versteigerungsphase mit einem Preiskorridor von 55–65 €."
        correct: true
      - text: "Es ist vollständig mit dem EU ETS verknüpft und nutzt dieselben Zertifikate."
        correct: false

  - text: "Wer muss im nationalen Emissionshandel (BEHG) CO₂-Zertifikate erwerben?"
    multi: false
    options:
      - text: "Unternehmen, die Brennstoffe in Verkehr bringen"
        correct: true
      - text: "Endverbraucher beim Kauf von Heizöl oder Benzin"
        correct: false
      - text: "Betreiber großer Kraftwerke und Industrieanlagen"
        correct: false
      - text: "Fahrzeughersteller für ihre verkauften Neuwagen"
        correct: false

  - text: "Welche Aussagen zum nationalen Emissionshandel treffen zu? (Mehrere Antworten möglich)"
    multi: true
    options:
      - text: "Er setzt wie der EU-Emissionshandel downstream an"
        correct: false
      - text: "Auch Betreiber bestimmter Abfallanlagen sind erfasst"
        correct: true
      - text: "Kosten werden an Industrie und Verbraucher weitergegeben"
        correct: true
      - text: "Ein Großteil der Einnahmen fließt in den KTF"
        correct: true

  - text: "Ab wann gilt im EU ETS 2 die Pflicht zur Abgabe von Zertifikaten?"
    multi: false
    options:
      - text: "Ab 2025, zeitgleich mit der Berichtspflicht"
        correct: false
      - text: "Ab 2027, wie ursprünglich beschlossen"
        correct: false
      - text: "Ab 2028, nach Verschiebung um ein Jahr"
        correct: true
      - text: "Ab 2030, mit Erreichen des Reduktionsziels"
        correct: false

  - text: "Welche Aussagen zum EU ETS 2 treffen zu? (Mehrere Antworten möglich)"
    multi: true
    options:
      - text: "Er erfasst insbesondere Gebäude und Straßenverkehr"
        correct: true
      - text: "Er ersetzt den ETS 1 für Strom und Industrie"
        correct: false
      - text: "Pflichtig sind Haushalte und Autofahrer direkt"
        correct: false
      - text: "In Deutschland gilt das BEHG bis zum Übergang"
        correct: true

  - text: "Welches Reduktionsziel verfolgt der EU ETS 2 bis 2030?"
    multi: false
    options:
      - text: "−55 % gegenüber dem Niveau von 1990"
        correct: false
      - text: "−42 % gegenüber dem Niveau von 2005"
        correct: true
      - text: "−90 % gegenüber dem Niveau von 1990"
        correct: false
      - text: "−62 % gegenüber dem Niveau von 2005"
        correct: false





  - text: "Der Zweck der EU-Taxonomie ist folgender"
    multi: false
    options:
      - text: "Wirtschaftstätigkeiten hinsichtlich ihrer ökologischen Nachhaltigkeit zu klassifizieren, um Investoren, Unternehmen und politische Entscheidungsträger zu informieren."
        correct: true
      - text: "Den CO₂-Preis im EU ETS zu regulieren."
        correct: false
      - text: "Eine einheitliche Bilanzierungsvorschrift für Treibhausgasemissionen zu schaffen."
        correct: false
      - text: "Subventionen für nachhaltige Technologien EU-weit zu verteilen."
        correct: false

  - text: "Folgende Ziele gehören zu den sechs Umweltzielen der EU-Taxonomie"
    multi: true
    options:
      - text: "Klimaschutz"
        correct: true
      - text: "Anpassung an den Klimawandel"
        correct: true
      - text: "Nachhaltige Nutzung von Wasser- und Meeresressourcen"
        correct: true
      - text: "Wandel zur Kreislaufwirtschaft"
        correct: true
      - text: "Schutz und Wiederherstellung der Biodiversität"
        correct: true
      - text: "Förderung erneuerbarer Energien als eigenständiges Ziel"
        correct: false
      - text: "Reduktion des Flugverkehrs"
        correct: false

  - text: "Kernenergie gilt laut EU-Taxonomie unter folgenden Bedingungen als klimafreundlich"
    multi: true
    options:
      - text: "Eine Baugenehmigung liegt vor 2045 vor."
        correct: true
      - text: "Ein nationaler Plan und finanzielle Mittel für die Atommüllentsorgung liegen vor."
        correct: true
      - text: "Der Anteil erneuerbarer Energien im nationalen Netz liegt unter 30 %."
        correct: false
      - text: "Das Kraftwerk ist mit einem CO₂-Abscheidesystem ausgestattet."
        correct: false

  - text: "Welche Aussagen zur Ausgangslage des EU-Aktionsplan Sustainable Finance von 2018 sind korrekt?"
    multi: true
    options:
      - text: "ESG-Kriterien fanden vor dem Aktionsplan wenig Berücksichtigung in der Finanzbranche."
        correct: true
      - text: "Es bestand die Gefahr von Greenwashing."
        correct: true
      - text: "Ein zentrales Ziel war die Etablierung eines EU-Klassifizierungssystems (Taxonomie)."
        correct: true
      - text: "Es fehlten einheitliche Definitionen für ESG-Kriterien."
        correct: true
      - text: "Nachhaltige Anleihen waren bereits vor 2018 der dominante Markt in Europa."
        correct: false

  - text: "Was muss eine ökologisch nachhaltige Wirtschaftstätigkeit laut EU-Taxonomie leisten?"
    multi: false
    options:
      - text: "Sie muss zu allen sechs Umweltzielen wesentlich beitragen."
        correct: false
      - text: "Sie muss zu mindestens einem der sechs Umweltziele wesentlich beitragen."
        correct: true
      - text: "Sie muss ausschließlich erneuerbare Energien nutzen."
        correct: false
      - text: "Sie muss von einer Zertifizierungsstelle anerkannt sein."
        correct: false

  - text: "Was beschreibt das Prinzip 'Do no significant harm' in der EU-Taxonomie?"
    multi: false
    options:
      - text: "Die Aktivität darf keine Gewinne erwirtschaften."
        correct: false
      - text: "Die Aktivität darf kein anderes Umweltziel signifikant beeinträchtigen."
        correct: true
      - text: "Die Aktivität muss soziale Mindeststandards erfüllen."
        correct: false
      - text: "Die Aktivität darf nicht börsennotiert sein."
        correct: false

  - text: "Was versteht man unter einer 'Ermöglichenden Wirtschaftstätigkeit' laut EU-Taxonomie?"
    multi: false
    options:
      - text: "Eine Tätigkeit, die direkt CO₂ reduziert."
        correct: false
      - text: "Eine Tätigkeit, die unmittelbar anderen Tätigkeiten ermöglicht, einen wesentlichen Beitrag zu mindestens einem Umweltziel zu leisten."
        correct: true
      - text: "Eine Tätigkeit im Bereich der erneuerbaren Energien."
        correct: false
      - text: "Eine Tätigkeit, die ausschließlich von der öffentlichen Hand durchgeführt wird."
        correct: false

  - text: "Welche Bedingungen muss eine Wirtschaftstätigkeit laut EU-Taxonomie erfüllen, um als nachhaltig zu gelten?"
    multi: true
    options:
      - text: "Wesentlichen Beitrag zu mindestens einem Umweltziel leisten."
        correct: true
      - text: "ESG-Mindestanforderungen erfüllen."
        correct: true
      - text: "Kein anderes Umweltziel signifikant beeinträchtigen (DNSH)."
        correct: true
      - text: "In allen sechs Umweltzielen führend sein."
        correct: false
      - text: "Von einer EU-Behörde zertifiziert werden."
        correct: false

  - text: "Was ist ein Lock-In-Effekt im Kontext nachhaltiger Finanzen?"
    multi: false
    options:
      - text: "Eine staatliche Förderung für nachhaltige Investitionen."
        correct: false
      - text: "Die Bindung von Unternehmen an nicht-nachhaltige Technologien durch langfristige Investitionsentscheidungen."
        correct: true
      - text: "Ein Mechanismus zur Sicherung von Gewinnen bei Investmentfonds."
        correct: false
      - text: "Eine Regulierung, die Unternehmen zur Nachhaltigkeitsberichterstattung verpflichtet."
        correct: false

  - text: "Welche der folgenden Beispiele sind klassische Lock-In-Effekte?"
    multi: true
    options:
      - text: "Bau eines Gaskraftwerks statt Solar- und Windlösungen."
        correct: true
      - text: "Ausbau eines großen Diesel-Fuhrparks statt Investitionen in Elektromobilität."
        correct: true
      - text: "Investition in fossil betriebene Heiz- und Kühlsysteme statt Wärmepumpen."
        correct: true
      - text: "Installation von Solaranlagen auf dem Firmendach."
        correct: false
      - text: "Umstieg auf klimaneutrale Produktionsprozesse."
        correct: false

  - text: "Wofür steht die Abkürzung CSRD?"
    multi: false
    options:
      - text: "Corporate Sustainability Reporting Directive"
        correct: true
      - text: "Climate and Social Responsibility Directive"
        correct: false
      - text: "Corporate Standards and Regulatory Disclosure"
        correct: false
      - text: "Climate Sustainability Reporting Directive"
        correct: false

  - text: "Was war der Vorgänger der CSRD?"
    multi: false
    options:
      - text: "SFDR"
        correct: false
      - text: "MiFID I"
        correct: false
      - text: "NFRD (Non-Financial Reporting Directive)"
        correct: true
      - text: "ESRS"
        correct: false

  - text: "Was ist das Ziel der CSRD?"
    multi: false
    options:
      - text: "Die Abschaffung der NFRD."
        correct: false
      - text: "Die Erhöhung der Rechenschaftspflicht europäischer Unternehmen über Nachhaltigkeitsaspekte und Einführung verbindlicher Berichtsstandards auf EU-Ebene."
        correct: true
      - text: "Die ausschließliche Regulierung von Finanzinstituten."
        correct: false
      - text: "Die Einführung eines einheitlichen CO₂-Preises in der EU."
        correct: false

  - text: "Wie viele Unternehmen sind nach vollständiger Einführung der CSRD (prä-Omnibus) EU-weit berichtspflichtig?"
    multi: false
    options:
      - text: "ca. 11.600"
        correct: false
      - text: "ca. 25.000"
        correct: false
      - text: "ca. 49.000"
        correct: true
      - text: "ca. 100.000"
        correct: false

  - text: "Was versteht die CSRD unter 'doppelter Wesentlichkeit'?"
    multi: false
    options:
      - text: "Unternehmen müssen sowohl Finanz- als auch Nachhaltigkeitsberichte erstellen."
        correct: false
